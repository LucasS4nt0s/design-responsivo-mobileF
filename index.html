<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Design Responsivo e Mobile First</title>
    <link rel="stylesheet" href="css/style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>

<body>

    <div class="card-geral">

        <div class="desktop">

            <div class="titulo">
                <span class="badge-superior temp"> ⚡ TEMPORADA 04 ATIVA </span>
            </div>

            <div class="hero">

                <div class="texto">
                    <h2> CyberStrike: Arena do Futuro </h2>
                    <p> Monte seu esquadrão cibernético, dispute torneios semanais e domine os servidores de alta performance com taxas de 144 FPS e premiações exclusivas. </p>
                </div>

                <div class="modalidades">
                    <span class="badge anti"> 🛡️ Anti-Cheat </span>
                    <span class="bagde tick"> ⚡128 Tick </span>
                    <span class="badge ranq"> 🏆 Ranqueado </span>
                </div>

                <button type="button" class="btn-cta"> JOGAR AGORA ⚔️ </button>
            </div>
        </div>

        <div class="perfil">
            <img src="assets/perfil.png" alt="Imagem do perfil">
        </div>
    </div>

</body>

</html>
